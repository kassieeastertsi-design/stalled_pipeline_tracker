    {id:48, account:'Wallace Turner Law',                      rep:'Jack Humphries', reason:'Domain',         due:'2026-06-30', mgrNotes:'Agency account. Agency was supposed to have access to the...',                agentNotes:'', called:false, launched:false},
    {id:49, account:"D's 4 Wheel Drive",                       rep:'Jack Humphries', reason:'Edits',          due:'2026-07-03', mgrNotes:'Client is delaying launch due to wanting to edit 20 pages of content',        agentNotes:'', called:false, launched:false},
    {id:50, account:"Orbit's Cajun Soul",                      rep:'Jack Humphries', reason:'Other',          due:'',           mgrNotes:'',                                                                              agentNotes:'', called:false, launched:false},

    {id:52, account:'2nd Alarm Trucking, Inc.',                rep:'Jack Humphries', reason:'Other',          due:'',           mgrNotes:'',                                                                              agentNotes:'', called:false, launched:false},
    {id:53, account:'Freedom Outdoor Lighting',                rep:'Jack Humphries', reason:'Other',          due:'',           mgrNotes:'',                                                                              agentNotes:'', called:false, launched:false},
    {id:54, account:'Exceptional Painting',                    rep:'Jack Humphries', reason:'Other',          due:'',           mgrNotes:'',                                                                              agentNotes:'', called:false, launched:false},
    {id:55, account:'Stark Landscape',                         rep:'Jack Humphries', reason:'Other',          due:'',           mgrNotes:'',                                                                              agentNotes:'', called:false, launched:false},

    {id:56, account:'Sundown Roofing LLC',                     rep:'Nate Natale',   reason:'Edits',          due:'2026-06-30', mgrNotes:'Received photos and good to launch',                                           agentNotes:'', called:false, launched:false},
    {id:57, account:'Central States Insurance Brokers',        rep:'Nate Natale',   reason:'Edits',          due:'2026-07-07', mgrNotes:'Add 3-5 pages to add. Add Jackson as watcher',                                agentNotes:'', called:true,  launched:false},
    {id:58, account:'Living Well Dakota',                      rep:'Nate Natale',   reason:'Edits',          due:'2026-07-07', mgrNotes:'Simple edits for an embed code',                                               agentNotes:'', called:true,  launched:false},
    {id:59, account:"Stephanie's Accounting",                  rep:'Nate Natale',   reason:'Edits',          due:'',           mgrNotes:'Moving offices last week. Good to follow up this week',                        agentNotes:'', called:true,  launched:false},
    {id:60, account:'Northwest Exposure Media',                rep:'Nate Natale',   reason:'Other',          due:'',           mgrNotes:'',                                                                              agentNotes:'', called:false, launched:false},
    {id:61, account:'All Set Appliance, LLC',                  rep:'Nate Natale',   reason:'Other',          due:'',           mgrNotes:'',                                                                              agentNotes:'', called:false, launched:false},

    {id:63, account:'Treasure Coast Thermal Solutions',        rep:'Nate Natale',   reason:'Other',          due:'',           mgrNotes:'',                                                                              agentNotes:'', called:false, launched:false},
  ];

  function sortKey(d){return d?d:'2099-12-31';}
  function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-');return`${m}/${d}/${y}`;}
  function getTodayStr(){return fmtDate(TODAY_ISO);}
  function dateStatus(due){
    if(!due)return{cls:'',tag:'',emailCls:'date-ok'};
    const diff=Math.ceil((new Date(due)-TODAY)/(1000*60*60*24));
    if(diff<0)return{cls:'overdue',tag:' ⚠',emailCls:'date-overdue'};
    if(diff===0)return{cls:'soon',tag:' 📅',emailCls:'date-soon'};
    if(diff<=7)return{cls:'soon',tag:'',emailCls:'date-soon'};
    return{cls:'',tag:'',emailCls:'date-ok'};
  }
  function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
  function sorted(arr){return[...arr].sort((a,b)=>sortKey(a.due)<sortKey(b.due)?-1:sortKey(a.due)>sortKey(b.due)?1:0);}
  function saveReason(id,val){const a=accounts.find(x=>x.id===id);if(a)a.reason=val;}
  function saveDue(id,val){const a=accounts.find(x=>x.id===id);if(a){a.due=val;renderMetrics();}}
  function saveMgrNotes(id,val){const a=accounts.find(x=>x.id===id);if(a)a.mgrNotes=val;}
  function saveAgentNotes(id,val){const a=accounts.find(x=>x.id===id);if(a)a.agentNotes=val;}
  function toggleCalled(id){const a=accounts.find(x=>x.id===id);if(a){a.called=!a.called;render();}}
  function toggleLaunch(id){const a=accounts.find(x=>x.id===id);if(!a||a.launched)return;a.launched=true;a.launchedDate=TODAY_ISO;render();}
  function toggleShowLaunched(){showLaunched=!showLaunched;render();}
  function setFilter(f,el){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}

  function getReps(){
    const active=accounts.filter(a=>!a.launched&&(currentFilter==='all'||a.reason===currentFilter));
    const map={};
    active.forEach(a=>{if(!map[a.rep])map[a.rep]={rep:a.rep,accounts:[]};map[a.rep].accounts.push(a);});
    Object.values(map).forEach(r=>{r.accounts=sorted(r.accounts);});
    return REP_ORDER.filter(r=>map[r]).map(r=>map[r]);
  }

  function renderRow(a){
    const ds=dateStatus(a.due);
    const launchBtn=a.launched?`<button class="launch-btn done" disabled>✓</button>`:`<button class="launch-btn" onclick="toggleLaunch(${a.id})" title="Mark as launched">✓</button>`;
    const reasonCell=a.launched?`<span class="badge badge-launched">Launched</span>`:`<select class="inline-select" onchange="saveReason(${a.id},this.value)">${REASONS.map(r=>`<option value="${r}"${r===a.reason?' selected':''}>${r}</option>`).join('')}</select>`;
    const dueCell=a.launched?`<span style="color:#16a34a">${fmtDate(a.launchedDate)}</span>`:`<input type="date" class="inline-date" value="${a.due}" onchange="saveDue(${a.id},this.value)"/>${a.due?`<span class="${ds.cls}" style="font-size:11px;display:block;margin-top:2px">${fmtDate(a.due)}${ds.tag}</span>`:''}`;
    const mgrCell=a.launched?`<span style="font-size:12px;color:#888">${a.mgrNotes||'—'}</span>`:`<textarea class="mgr-notes-input" placeholder="Manager notes…" onchange="saveMgrNotes(${a.id},this.value)" onblur="saveMgrNotes(${a.id},this.value)">${a.mgrNotes}</textarea>`;
    const agentCell=a.launched?`<span style="font-size:12px;color:#888">${a.agentNotes||'—'}</span>`:`<textarea class="agent-notes-input" placeholder="Agent notes…" onchange="saveAgentNotes(${a.id},this.value)" onblur="saveAgentNotes(${a.id},this.value)">${a.agentNotes}</textarea>`;
    const calledCell=a.launched?'':`<div class="called-wrap"><input type="checkbox" class="called-cb" ${a.called?'checked':''} onchange="toggleCalled(${a.id})"/><span class="${a.called?'called-yes':'called-label'}">${a.called?'✓ Called':'Called?'}</span></div>`;
    return`<tr class="${a.launched?'launched':''}">
      <td class="col-launch">${launchBtn}</td>
      <td class="col-account" style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${a.account}">${a.account}</td>
      <td class="col-reason">${reasonCell}</td>
      <td class="col-due">${dueCell}</td>
      <td class="col-mgr">${mgrCell}</td>
      <td class="col-agent">${agentCell}</td>
      <td class="col-called" style="text-align:center">${calledCell}</td>
      <td class="col-actions"><button class="action-btn" onclick="del(${a.id})" title="Remove">🗑</button></td>
    </tr>`;
  }

  function render(){
    renderMetrics();
    const reps=getReps();
    const launched=sorted(accounts.filter(a=>a.launched));
    const container=document.getElementById('rep-sections');
    let html='';
    if(reps.length===0&&launched.length===0){html=`<div class="empty-state">No accounts for this filter.</div>`;}
    else{
      html+=reps.map(r=>`
        <div class="rep-section">
          <div class="rep-header">
            <div class="rep-info">
              <div class="avatar">${initials(r.rep)}</div>
              <div><div class="rep-name">${r.rep}</div><div class="rep-count">${r.accounts.length} account${r.accounts.length!==1?'s':''}</div></div>
            </div>
            <button class="email-rep-btn" onclick="openRepEmail('${encodeURIComponent(r.rep)}')">✉ Draft digest email</button>
          </div>
          <div class="table-wrap"><table>
            <thead><tr>
              <th class="col-launch"></th><th class="col-account">Account</th><th class="col-reason">Stall reason</th>
              <th class="col-due">Due date ▲</th><th class="col-mgr">Manager Notes</th>
              <th class="col-agent">Agent Notes</th><th class="col-called" style="text-align:center">Called?</th><th class="col-actions">Actions</th>
            </tr></thead>
            <tbody>${r.accounts.map(renderRow).join('')}</tbody>
          </table></div>
        </div>`).join('');
      if(launched.length>0){
        html+=`<div class="launched-section">
          <button class="launched-toggle" onclick="toggleShowLaunched()">${showLaunched?'▼':'▶'} Launched accounts (${launched.length})</button>
          ${showLaunched?`<div class="table-wrap"><table>
            <thead><tr><th class="col-launch"></th><th class="col-account">Account</th><th class="col-reason">Status</th><th class="col-due">Launched</th><th class="col-mgr">Manager Notes</th><th class="col-agent">Agent Notes</th><th class="col-called"></th><th class="col-actions">Actions</th></tr></thead>
            <tbody>${launched.map(renderRow).join('')}</tbody>
          </table></div>`:''}
        </div>`;
      }
    }
    container.innerHTML=html;
  }

  function renderMetrics(){
    const active=accounts.filter(a=>!a.launched);
    const launchedCnt=accounts.filter(a=>a.launched).length;
    const overdue=active.filter(a=>dateStatus(a.due).cls==='overdue').length;
    const domain=active.filter(a=>a.reason==='Domain').length;
    const edits=active.filter(a=>a.reason==='Edits').length;
    const unresponsive=active.filter(a=>a.reason==='Unresponsive').length;
    const lt=active.filter(a=>a.reason==='Launching Today').length;
    const other=active.filter(a=>a.reason==='Other'||a.reason==='Approval Needed').length;
    const called=active.filter(a=>a.called).length;
    document.getElementById('metrics').innerHTML=`
      <div class="metric"><div class="metric-label">Active stalls</div><div class="metric-val">${active.length}</div></div>
      <div class="metric"><div class="metric-label">Overdue</div><div class="metric-val" style="color:#b91c1c">${overdue}</div></div>
      <div class="metric"><div class="metric-label">Domain issues</div><div class="metric-val">${domain}</div></div>
      <div class="metric"><div class="metric-label">Edits pending</div><div class="metric-val">${edits}</div></div>
      <div class="metric"><div class="metric-label">Unresponsive</div><div class="metric-val">${unresponsive}</div></div>
      <div class="metric"><div class="metric-label">Launching today</div><div class="metric-val" style="color:#16a34a">${lt}</div></div>
      <div class="metric"><div class="metric-label">Other</div><div class="metric-val">${other}</div></div>
      <div class="metric"><div class="metric-label">Called today</div><div class="metric-val" style="color:#16a34a">${called}</div></div>
      <div class="metric"><div class="metric-label">Launched</div><div class="metric-val" style="color:#16a34a">${launchedCnt}</div></div>`;
  }

  function buildEmailRows(accts){
    return sorted(accts).map(a=>{
      const ds=dateStatus(a.due);
      const diff=a.due?Math.ceil((new Date(a.due)-TODAY)/(1000*60*60*24)):null;
      const flag=ds.cls==='overdue'?' ⚠ OVERDUE':diff===0?' (today)':ds.cls==='soon'?' (soon)':'';
      const calledTag=a.called?` <span style="font-size:10px;color:#16a34a;font-weight:600">(Called ✓)</span>`:'';
      return`<tr>
        <td style="font-weight:600;padding:7px 12px;border:1px solid #d1d0c8;white-space:nowrap">${a.account}${calledTag}</td>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;white-space:nowrap"><span class="reason-pill ${REASON_PILL[a.reason]||'rp-other'}">${a.reason}</span></td>
        <td class="${ds.emailCls}" style="padding:7px 12px;border:1px solid #d1d0c8;white-space:nowrap">${a.due?fmtDate(a.due)+flag:'TBD'}</td>
        <td style="padding:7px 12px;border:1px solid #d1d0c8">${a.mgrNotes||'—'}</td>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;color:#555;font-style:italic">${a.agentNotes||'—'}</td>
      </tr>`;
    }).join('');
  }

  function openRepEmail(repEnc){
    const repName=decodeURIComponent(repEnc);
    const repEmail=REP_EMAILS[repName]||'';
    const accts=accounts.filter(a=>a.rep===repName&&!a.launched);
    const overdue=accts.filter(a=>dateStatus(a.due).cls==='overdue').length;
    const soon=accts.filter(a=>dateStatus(a.due).cls==='soon').length;
    const firstName=repName.split(' ')[0];
    const todayStr=getTodayStr();
    let urgHtml='';
    if(overdue>0)urgHtml=`<div class="urgency">⚠ ${overdue} account${overdue>1?'s are':' is'} past due — please prioritize immediately.</div>`;
    else if(soon>0)urgHtml=`<div class="urgency-warn">⏰ ${soon} account${soon>1?'s have':' has'} a due date within 7 days.</div>`;
    document.getElementById('modal-root').innerHTML=`
      <div class="modal-bg" onclick="closeMBg(event)">
        <div class="modal" onclick="event.stopPropagation()">
          <h2>✉ Digest email — ${repName}</h2>
          <div class="email-shell">
            <div class="email-meta">
              <div class="email-meta-row"><span class="email-meta-lbl">To</span><span class="email-meta-val"><input id="em-to" value="${repEmail}"/></span></div>
              <div class="email-meta-row"><span class="email-meta-lbl">Subject</span><span class="email-meta-val"><input id="em-sub" value="Action needed: your stalled accounts — ${todayStr||'today'}"/></span></div>
            </div>
            <div class="email-preview-body" id="em-body">
              <p style="font-family:Arial,sans-serif">Hi ${firstName},</p>
              <p style="font-family:Arial,sans-serif">Here's your stalled account summary${todayStr?' as of '+todayStr:''}, sorted by due date. Please prioritize the accounts at the top of the list first.</p>
              ${urgHtml}
              <table class="email-acct-table">
                <thead><tr><th>Account</th><th>Stall reason</th><th>Due date ▲</th><th>Manager notes</th><th>Agent notes</th></tr></thead>
                <tbody>${buildEmailRows(accts)}</tbody>
              </table>
              <p style="font-family:Arial,sans-serif">For each account: reach out to the client directly, log updates in the agent notes field, and flag anything blocking you so we can help.</p>
              <p style="font-family:Arial,sans-serif">Thank you for staying on top of these!</p>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeMEl()">Close</button>
            <button class="btn-primary" onclick="copyHTML('${encodeURIComponent(repName)}')">Copy HTML <span class="copied" id="cp-html">Copied!</span></button>
            <button class="btn-primary" onclick="openMailto()">↗ Open in mail</button>
          </div>
        </div>
      </div>`;
  }

  function copyHTML(repEnc){
    const repName=decodeURIComponent(repEnc);
    const accts=accounts.filter(a=>a.rep===repName&&!a.launched);
    const firstName=repName.split(' ')[0];
    const overdue=accts.filter(a=>dateStatus(a.due).cls==='overdue').length;
    const soon=accts.filter(a=>dateStatus(a.due).cls==='soon').length;
    const todayStr=getTodayStr();
    let urgInline='';
    if(overdue>0)urgInline=`<p style="color:#b91c1c;font-weight:600;padding:8px 10px;background:#fef2f2;border-left:3px solid #b91c1c;font-family:Arial,sans-serif;font-size:13px">⚠ ${overdue} account${overdue>1?'s are':' is'} past due — please prioritize immediately.</p>`;
    else if(soon>0)urgInline=`<p style="color:#92400e;font-weight:600;padding:8px 10px;background:#fffbeb;border-left:3px solid #d97706;font-family:Arial,sans-serif;font-size:13px">⏰ ${soon} account${soon>1?'s have':' has'} a due date within 7 days.</p>`;
    const rows=sorted(accts).map((a,i)=>{
      const ds=dateStatus(a.due);
      const diff=a.due?Math.ceil((new Date(a.due)-TODAY)/(1000*60*60*24)):null;
      const flag=ds.cls==='overdue'?' ⚠ OVERDUE':diff===0?' (today)':ds.cls==='soon'?' (soon)':'';
      const dateColor=ds.cls==='overdue'?'#b91c1c':ds.cls==='soon'?'#b45309':'#1a1a1a';
      const dateBold=ds.cls!==''?'font-weight:700;':'';
      const bg=i%2===0?'#ffffff':'#f5f5f2';
      const ps=PILL_INLINE[a.reason]||PILL_INLINE['Other'];
      const calledTag=a.called?` <span style="font-size:10px;color:#16a34a;font-weight:700">(Called ✓)</span>`:'';
      return`<tr>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;background:${bg};font-weight:600;white-space:nowrap;font-family:Arial,sans-serif;font-size:12px">${a.account}${calledTag}</td>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;background:${bg};white-space:nowrap;font-family:Arial,sans-serif;font-size:12px"><span style="display:inline-block;padding:2px 8px;border-radius:3px;font-weight:600;font-size:11px;${ps}">${a.reason}</span></td>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;background:${bg};white-space:nowrap;color:${dateColor};${dateBold}font-family:Arial,sans-serif;font-size:12px">${a.due?fmtDate(a.due)+flag:'TBD'}</td>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;background:${bg};font-family:Arial,sans-serif;font-size:12px">${a.mgrNotes||'—'}</td>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;background:${bg};font-family:Arial,sans-serif;font-size:12px;color:#555;font-style:italic">${a.agentNotes||'—'}</td>
      </tr>`;
    }).join('');
    const html=`<div style="font-family:Arial,sans-serif;font-size:13px;color:#1a1a1a">
      <p>Hi ${firstName},</p><p>Here's your stalled account summary${todayStr?' as of '+todayStr:''}, sorted by due date. Please prioritize the accounts at the top first.</p>
      ${urgInline}
      <table style="width:100%;border-collapse:collapse;font-size:12px;font-family:Arial,sans-serif;margin:12px 0">
        <thead><tr>
          <th style="background:#fff;color:#1a1a1a;font-weight:700;padding:8px 12px;border:1.5px solid #c0bfb8;text-align:left">Account</th>
          <th style="background:#fff;color:#1a1a1a;font-weight:700;padding:8px 12px;border:1.5px solid #c0bfb8;text-align:left">Stall reason</th>
          <th style="background:#fff;color:#1a1a1a;font-weight:700;padding:8px 12px;border:1.5px solid #c0bfb8;text-align:left">Due date ▲</th>
          <th style="background:#fff;color:#1a1a1a;font-weight:700;padding:8px 12px;border:1.5px solid #c0bfb8;text-align:left">Manager notes</th>
          <th style="background:#fff;color:#1a1a1a;font-weight:700;padding:8px 12px;border:1.5px solid #c0bfb8;text-align:left">Agent notes</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p>For each account: reach out to the client directly, log updates in the agent notes field, and flag anything blocking you so we can help.</p>
      <p>Thank you for staying on top of these!</p>
    </div>`;
    const htmlBlob=new Blob([html],{type:'text/html'});
    const plainBlob=new Blob([document.getElementById('em-body').innerText],{type:'text/plain'});
    if(window.ClipboardItem){navigator.clipboard.write([new ClipboardItem({'text/html':htmlBlob,'text/plain':plainBlob})]).then(()=>flash('cp-html')).catch(()=>navigator.clipboard.writeText(document.getElementById('em-body').innerText).then(()=>flash('cp-html')));}
    else{navigator.clipboard.writeText(document.getElementById('em-body').innerText).then(()=>flash('cp-html'));}
  }

  function flash(id){const el=document.getElementById(id);if(!el)return;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000);}
  function openMailto(){
    const to=document.getElementById('em-to').value;
    const sub=encodeURIComponent(document.getElementById('em-sub').value);
    const body=encodeURIComponent(document.getElementById('em-body').innerText);
    window.location.href=`mailto:${to}?subject=${sub}&body=${body}`;
  }

  function openAdd(){
    document.getElementById('modal-root').innerHTML=`
      <div class="modal-bg" onclick="closeMBg(event)">
        <div class="modal" onclick="event.stopPropagation()">
          <h2>Add stalled account</h2>
          <div class="field"><label>Account name</label><input id="f-account" placeholder="e.g. Acme Corp"/></div>
          <div class="field"><label>Rep</label><select id="f-rep">${REP_ORDER.map(r=>`<option>${r}</option>`).join('')}</select></div>
          <div class="field"><label>Stall reason</label><select id="f-reason">${REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div>
          <div class="field"><label>Due date</label><input id="f-due" type="date"/></div>
          <div class="field"><label>Manager notes</label><textarea id="f-notes" placeholder="Notes…"></textarea></div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeMEl()">Cancel</button>
            <button class="btn-primary" onclick="saveAdd()">Add account</button>
          </div>
        </div>
      </div>`;
  }
  function saveAdd(){
    const account=document.getElementById('f-account').value.trim();
    if(!account){alert('Account name is required.');return;}
    accounts.push({id:nextId++,account,rep:document.getElementById('f-rep').value,reason:document.getElementById('f-reason').value,due:document.getElementById('f-due').value||'',mgrNotes:document.getElementById('f-notes').value.trim(),agentNotes:'',called:false,launched:false});
    closeMEl();render();
  }
  function del(id){if(!confirm('Remove this account?'))return;accounts=accounts.filter(x=>x.id!==id);render();}
  function closeMBg(e){if(e.target.classList.contains('modal-bg'))closeMEl();}
  function closeMEl(){document.getElementById('modal-root').innerHTML='';}

  render();
</script>
</body>
</html>
