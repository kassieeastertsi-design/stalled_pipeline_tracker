    {id:49,account:'Slimesure US',               rep:'Dylan Lawson', repEmail:'dylan@yourcompany.com',reason:'Unresponsive',   due:'2026-06-30', notes:'Unresponsive. 4 points of contact. Client set their own deadline.', launched:false},
    {id:50,account:'Confianza Quick Access',     rep:'Dylan Lawson', repEmail:'dylan@yourcompany.com',reason:'Domain',         due:'2026-06-12', notes:'Need GD access via 2-step process.', launched:false},
    {id:51,account:'Little Star',                rep:'Dylan Lawson', repEmail:'dylan@yourcompany.com',reason:'Launching Today',due:'2026-06-09', notes:'Was scheduled 6/8 — confirm launch today.', launched:false},
    {id:52,account:'A1 Restoration',             rep:'Dylan Lawson', repEmail:'dylan@yourcompany.com',reason:'Domain',         due:'2026-06-15', notes:'Domain logins needed. Client expected to respond within 24 hours.', launched:false},
    {id:53,account:'Shamrock Renovations',       rep:'Dylan Lawson', repEmail:'dylan@yourcompany.com',reason:'Domain',         due:'2026-06-09', notes:'GD access needed — due today (6/9).', launched:false},
    {id:54,account:'Knockout Design',            rep:'Dylan Lawson', repEmail:'dylan@yourcompany.com',reason:'Domain',         due:'2026-06-15', notes:'Domain held by a previous marketing company.', launched:false},
  ];

  let nextId = 55;
  let showLaunched = false;
  let currentFilter = 'all';

  /* ── Helpers ── */
  function fmtDate(s) {
    if (!s) return 'TBD';
    const [y,m,d] = s.split('-');
    return `${m}/${d}/${y}`;
  }
  function dateStatus(due) {
    if (!due) return {cls:'', tag:'', emailCls:'date-ok'};
    const diff = Math.ceil((new Date(due) - TODAY) / (1000*60*60*24));
    if (diff < 0)  return {cls:'overdue', tag:' ⚠', emailCls:'date-overdue'};
    if (diff === 0) return {cls:'soon', tag:' 📅', emailCls:'date-soon'};
    if (diff <= 7)  return {cls:'soon', tag:'', emailCls:'date-soon'};
    return {cls:'', tag:'', emailCls:'date-ok'};
  }
  function initials(n) { return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
  function sorted(arr) {
    return [...arr].sort((a,b) => sortKey(a.due) < sortKey(b.due) ? -1 : sortKey(a.due) > sortKey(b.due) ? 1 : 0);
  }
  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    render();
  }
  function toggleLaunch(id) {
    const a = accounts.find(x => x.id === id);
    if (a.launched) return;
    a.launched = true;
    a.launchedDate = TODAY_ISO;
    render();
  }

  /* ── Rep list ── */
  function getReps() {
    const active = accounts.filter(a => !a.launched && (currentFilter === 'all' || a.reason === currentFilter));
    const map = {};
    active.forEach(a => {
      if (!map[a.rep]) map[a.rep] = {rep: a.rep, repEmail: a.repEmail, accounts: []};
      map[a.rep].accounts.push(a);
    });
    Object.values(map).forEach(r => { r.accounts = sorted(r.accounts); });
    return ['James Arpee','Jack Humphries','Nate Natale','Ellyn Lindh','Dylan Lawson']
      .filter(r => map[r]).map(r => map[r]);
  }

  /* ── Row renderer ── */
  function renderRow(a) {
    const ds = dateStatus(a.due);
    const launchBtn = a.launched
      ? `<button class="launch-btn done" disabled>✓</button>`
      : `<button class="launch-btn" onclick="toggleLaunch(${a.id})" title="Mark launched">✓</button>`;
    const reasonCell = a.launched
      ? `<span class="badge badge-launched">Launched</span>`
      : `<span class="badge ${BADGE_CLS[a.reason]||'badge-other'}">${a.reason}</span>`;
    const dueCell = a.launched
      ? `<span style="color:#16a34a">${fmtDate(a.launchedDate)}</span>`
      : `<span class="${ds.cls}">${fmtDate(a.due)}${ds.tag}</span>`;
    return `<tr class="${a.launched ? 'launched' : ''}">
      <td>${launchBtn}</td>
      <td title="${a.account}" style="font-weight:500">${a.account}</td>
      <td>${reasonCell}</td>
      <td>${dueCell}</td>
      <td style="color:#666;white-space:normal;line-height:1.4;font-size:12px">${a.notes}</td>
      <td>
        ${!a.launched ? `<button class="action-btn" onclick="openEdit(${a.id})" title="Edit">✏</button>` : ''}
        <button class="action-btn" onclick="del(${a.id})" title="Remove">🗑</button>
      </td>
    </tr>`;
  }

  /* ── Main render ── */
  function render() {
    renderMetrics();
    const reps = getReps();
    const launched = sorted(accounts.filter(a => a.launched));
    const container = document.getElementById('rep-sections');
    let html = '';

    if (reps.length === 0 && launched.length === 0) {
      html = `<div class="empty-state">No accounts for this filter.</div>`;
    } else {
      html += reps.map(r => `
        <div class="rep-section">
          <div class="rep-header">
            <div class="rep-info">
              <div class="avatar">${initials(r.rep)}</div>
              <div>
                <div class="rep-name">${r.rep}</div>
                <div class="rep-count">${r.accounts.length} account${r.accounts.length !== 1 ? 's' : ''}</div>
              </div>
            </div>
            <button class="email-rep-btn" onclick="openRepEmail('${encodeURIComponent(r.rep)}')">✉ Draft digest email</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th></th><th>Account</th><th>Reason</th>
                <th>Due date ▲</th><th>Notes / next steps</th><th>Actions</th>
              </tr></thead>
              <tbody>${r.accounts.map(renderRow).join('')}</tbody>
            </table>
          </div>
        </div>`).join('');

      if (launched.length > 0) {
        html += `<div class="launched-section">
          <button class="launched-toggle" onclick="toggleShowLaunched()">
            ${showLaunched ? '▼' : '▶'} Launched accounts (${launched.length})
          </button>
          ${showLaunched ? `<div class="table-wrap"><table>
            <thead><tr><th></th><th>Account</th><th>Status</th><th>Launched</th><th>Notes</th><th>Actions</th></tr></thead>
            <tbody>${launched.map(renderRow).join('')}</tbody>
          </table></div>` : ''}
        </div>`;
      }
    }
    container.innerHTML = html;
  }

  function toggleShowLaunched() { showLaunched = !showLaunched; render(); }

  /* ── Metrics ── */
  function renderMetrics() {
    const active    = accounts.filter(a => !a.launched);
    const launched  = accounts.filter(a =>  a.launched).length;
    const overdue      = active.filter(a => dateStatus(a.due).cls === 'overdue').length;
    const domain       = active.filter(a => a.reason === 'Domain').length;
    const edits        = active.filter(a => a.reason === 'Edits').length;
    const unresponsive = active.filter(a => a.reason === 'Unresponsive').length;
    const lt           = active.filter(a => a.reason === 'Launching Today').length;
    const other        = active.filter(a => a.reason === 'Other' || a.reason === 'Approval Needed').length;

    document.getElementById('metrics').innerHTML = `
      <div class="metric"><div class="metric-label">Active stalls</div><div class="metric-val">${active.length}</div></div>
      <div class="metric"><div class="metric-label">Overdue</div><div class="metric-val" style="color:#b91c1c">${overdue}</div></div>
      <div class="metric"><div class="metric-label">Domain issues</div><div class="metric-val">${domain}</div></div>
      <div class="metric"><div class="metric-label">Edits pending</div><div class="metric-val">${edits}</div></div>
      <div class="metric"><div class="metric-label">Unresponsive</div><div class="metric-val">${unresponsive}</div></div>
      <div class="metric"><div class="metric-label">Launching today</div><div class="metric-val" style="color:#16a34a">${lt}</div></div>
      <div class="metric"><div class="metric-label">Other</div><div class="metric-val">${other}</div></div>
      <div class="metric"><div class="metric-label">Launched</div><div class="metric-val" style="color:#16a34a">${launched}</div></div>`;
  }

  /* ── Email builder ── */
  function buildEmailRows(accts) {
    return sorted(accts).map(a => {
      const ds = dateStatus(a.due);
      const diff = Math.ceil((new Date(a.due) - TODAY) / (1000*60*60*24));
      const flag = ds.cls === 'overdue' ? ' ⚠ OVERDUE' : diff === 0 ? ' (today)' : ds.cls === 'soon' ? ' (soon)' : '';
      return `<tr>
        <td class="td-account">${a.account}</td>
        <td class="td-reason"><span class="reason-pill ${REASON_PILL[a.reason]||'rp-other'}">${a.reason}</span></td>
        <td class="td-date ${ds.emailCls}">${fmtDate(a.due)}${flag}</td>
        <td class="td-notes">${a.notes}</td>
      </tr>`;
    }).join('');
  }

  function openRepEmail(repEnc) {
    const repName  = decodeURIComponent(repEnc);
    const repEmail = (accounts.find(a => a.rep === repName) || {}).repEmail || '';
    const accts    = accounts.filter(a => a.rep === repName && !a.launched);
    const overdue  = accts.filter(a => dateStatus(a.due).cls === 'overdue').length;
    const soon     = accts.filter(a => dateStatus(a.due).cls === 'soon').length;
    const firstName = repName.split(' ')[0];

    let urgHtml = '';
    if (overdue > 0)
      urgHtml = `<div class="urgency">⚠ ${overdue} account${overdue>1?'s are':' is'} past due — please prioritize immediately.</div>`;
    else if (soon > 0)
      urgHtml = `<div class="urgency-warn">⏰ ${soon} account${soon>1?'s have':' has'} a due date within 7 days.</div>`;

    document.getElementById('modal-root').innerHTML = `
      <div class="modal-bg" onclick="closeMBg(event)">
        <div class="modal" onclick="event.stopPropagation()">
          <h2>✉ Digest email — ${repName}</h2>
          <div class="email-shell">
            <div class="email-meta">
              <div class="email-meta-row">
                <span class="email-meta-lbl">To</span>
                <span class="email-meta-val"><input id="em-to" value="${repEmail}" /></span>
              </div>
              <div class="email-meta-row">
                <span class="email-meta-lbl">Subject</span>
                <span class="email-meta-val"><input id="em-sub" value="Action needed: your stalled accounts — ${TODAY_STR}" /></span>
              </div>
            </div>
            <div class="email-preview-body" id="em-body">
              <p style="font-family:Arial,sans-serif">Hi ${firstName},</p>
              <p style="font-family:Arial,sans-serif">Here's your stalled account summary as of ${TODAY_STR}, sorted by due date. Please prioritize the accounts at the top of the list first.</p>
              ${urgHtml}
              <table class="email-acct-table">
                <thead><tr>
                  <th>Account</th><th>Stall reason</th><th>Due date ▲</th><th>Notes / next steps</th>
                </tr></thead>
                <tbody>${buildEmailRows(accts)}</tbody>
              </table>
              <p style="font-family:Arial,sans-serif">For each account: reach out to the client directly, log updates in the pipeline tracker, and flag anything blocking you so we can help.</p>
              <p style="font-family:Arial,sans-serif">Thank you for staying on top of these!</p>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeMEl()">Close</button>
            <button class="btn-primary" onclick="copyHTML('${encodeURIComponent(repName)}')">Copy HTML <span class="copied" id="cp-html">Copied!</span></button>
            <button class="btn-primary" onclick="openMailto()">↗ Open in mail</button>
          </div>
        </div>
      </div>`;
  }

  function copyHTML(repEnc) {
    const repName   = decodeURIComponent(repEnc);
    const accts     = accounts.filter(a => a.rep === repName && !a.launched);
    const firstName = repName.split(' ')[0];
    const overdue   = accts.filter(a => dateStatus(a.due).cls === 'overdue').length;
    const soon      = accts.filter(a => dateStatus(a.due).cls === 'soon').length;

    let urgInline = '';
    if (overdue > 0)
      urgInline = `<p style="color:#b91c1c;font-weight:600;padding:8px 10px;background:#fef2f2;border-left:3px solid #b91c1c;font-family:Arial,sans-serif;font-size:13px">⚠ ${overdue} account${overdue>1?'s are':' is'} past due — please prioritize immediately.</p>`;
    else if (soon > 0)
      urgInline = `<p style="color:#92400e;font-weight:600;padding:8px 10px;background:#fffbeb;border-left:3px solid #d97706;font-family:Arial,sans-serif;font-size:13px">⏰ ${soon} account${soon>1?'s have':' has'} a due date within 7 days.</p>`;

    const pillStyles = {
      'Domain':         'background:#dbeafe;color:#1e40af;border:1px solid #93c5fd',
      'Edits':          'background:#ede9fe;color:#4c1d95;border:1px solid #c4b5fd',
      'Unresponsive':   'background:#fef3c7;color:#78350f;border:1px solid #fcd34d',
      'Launching Today':'background:#dcfce7;color:#14532d;border:1px solid #86efac',
      'Approval Needed':'background:#f3f4f6;color:#374151;border:1px solid #d1d5db',
      'Other':          'background:#f3f4f6;color:#374151;border:1px solid #d1d5db'
    };

    const rows = sorted(accts).map((a, i) => {
      const ds   = dateStatus(a.due);
      const diff = Math.ceil((new Date(a.due) - TODAY) / (1000*60*60*24));
      const flag = ds.cls === 'overdue' ? ' ⚠ OVERDUE' : diff === 0 ? ' (today)' : ds.cls === 'soon' ? ' (soon)' : '';
      const dateColor = ds.cls === 'overdue' ? '#b91c1c' : ds.cls === 'soon' ? '#b45309' : '#1a1a1a';
      const dateBold  = ds.cls !== '' ? 'font-weight:700;' : '';
      const bg  = i % 2 === 0 ? '#ffffff' : '#f5f5f2';
      const ps  = pillStyles[a.reason] || pillStyles['Other'];
      return `<tr>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;background:${bg};font-weight:600;white-space:nowrap;font-family:Arial,sans-serif;font-size:12px">${a.account}</td>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;background:${bg};white-space:nowrap;font-family:Arial,sans-serif;font-size:12px"><span style="display:inline-block;padding:2px 8px;border-radius:3px;font-weight:600;font-size:11px;${ps}">${a.reason}</span></td>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;background:${bg};white-space:nowrap;color:${dateColor};${dateBold}font-family:Arial,sans-serif;font-size:12px">${fmtDate(a.due)}${flag}</td>
        <td style="padding:7px 12px;border:1px solid #d1d0c8;background:${bg};font-family:Arial,sans-serif;font-size:12px">${a.notes}</td>
      </tr>`;
    }).join('');

    const html = `<div style="font-family:Arial,sans-serif;font-size:13px;color:#1a1a1a">
      <p>Hi ${firstName},</p>
      <p>Here's your stalled account summary as of ${TODAY_STR}, sorted by due date. Please prioritize the accounts at the top of the list first.</p>
      ${urgInline}
      <table style="width:100%;border-collapse:collapse;font-size:12px;font-family:Arial,sans-serif;margin:12px 0">
        <thead><tr>
          <th style="background:#ffffff;color:#1a1a1a;font-weight:700;padding:8px 12px;border:1.5px solid #c0bfb8;text-align:left;white-space:nowrap">Account</th>
          <th style="background:#ffffff;color:#1a1a1a;font-weight:700;padding:8px 12px;border:1.5px solid #c0bfb8;text-align:left;white-space:nowrap">Stall reason</th>
          <th style="background:#ffffff;color:#1a1a1a;font-weight:700;padding:8px 12px;border:1.5px solid #c0bfb8;text-align:left;white-space:nowrap">Due date ▲</th>
          <th style="background:#ffffff;color:#1a1a1a;font-weight:700;padding:8px 12px;border:1.5px solid #c0bfb8;text-align:left">Notes / next steps</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p>For each account: reach out to the client directly, log updates in the pipeline tracker, and flag anything blocking you so we can help.</p>
      <p>Thank you for staying on top of these!</p>
    </div>`;

    const htmlBlob  = new Blob([html], {type:'text/html'});
    const plainBlob = new Blob([document.getElementById('em-body').innerText], {type:'text/plain'});
    if (window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({'text/html': htmlBlob, 'text/plain': plainBlob})])
        .then(() => flash('cp-html'))
        .catch(() => navigator.clipboard.writeText(document.getElementById('em-body').innerText).then(() => flash('cp-html')));
    } else {
      navigator.clipboard.writeText(document.getElementById('em-body').innerText).then(() => flash('cp-html'));
    }
  }

  function flash(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  function openMailto() {
    const to   = document.getElementById('em-to').value;
    const sub  = encodeURIComponent(document.getElementById('em-sub').value);
    const body = encodeURIComponent(document.getElementById('em-body').innerText);
    window.location.href = `mailto:${to}?subject=${sub}&body=${body}`;
  }

  /* ── Add / Edit / Delete ── */
  const REP_EMAILS = {
    'James Arpee':'james@yourcompany.com', 'Jack Humphries':'jack@yourcompany.com',
    'Nate Natale':'nate@yourcompany.com',  'Ellyn Lindh':'ellyn@yourcompany.com',
    'Dylan Lawson':'dylan@yourcompany.com'
  };

  function openAdd() {
    document.getElementById('modal-root').innerHTML = `
      <div class="modal-bg" onclick="closeMBg(event)">
        <div class="modal" onclick="event.stopPropagation()">
          <h2>Add stalled account</h2>
          <div class="field"><label>Account name</label><input id="f-account" placeholder="e.g. Acme Corp" /></div>
          <div class="field"><label>Rep</label>
            <select id="f-rep">
              <option>James Arpee</option><option>Jack Humphries</option>
              <option>Nate Natale</option><option>Ellyn Lindh</option><option>Dylan Lawson</option>
            </select>
          </div>
          <div class="field"><label>Rep email</label><input id="f-repemail" type="email" placeholder="rep@yourcompany.com" /></div>
          <div class="field"><label>Stall reason</label>
            <select id="f-reason">${REASONS.map(r=>`<option>${r}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Due date</label><input id="f-due" type="date" /></div>
          <div class="field"><label>Notes / next steps</label><textarea id="f-notes" placeholder="What's blocking progress?"></textarea></div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeMEl()">Cancel</button>
            <button class="btn-primary" onclick="saveAdd()">Add account</button>
          </div>
        </div>
      </div>`;
  }

  function saveAdd() {
    const a = document.getElementById('f-account').value.trim();
    const r = document.getElementById('f-rep').value;
    if (!a) { alert('Account name is required.'); return; }
    accounts.push({
      id: nextId++, account: a, rep: r,
      repEmail: document.getElementById('f-repemail').value.trim() || REP_EMAILS[r] || '',
      reason: document.getElementById('f-reason').value,
      due: document.getElementById('f-due').value || '',
      notes: document.getElementById('f-notes').value.trim(),
      launched: false
    });
    closeMEl(); render();
  }

  function openEdit(id) {
    const a = accounts.find(x => x.id === id);
    document.getElementById('modal-root').innerHTML = `
      <div class="modal-bg" onclick="closeMBg(event)">
        <div class="modal" onclick="event.stopPropagation()">
          <h2>Edit account</h2>
          <div class="field"><label>Account name</label><input id="f-account" value="${a.account}" /></div>
          <div class="field"><label>Rep</label>
            <select id="f-rep">
              ${['James Arpee','Jack Humphries','Nate Natale','Ellyn Lindh','Dylan Lawson']
                .map(r=>`<option${r===a.rep?' selected':''}>${r}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Stall reason</label>
            <select id="f-reason">${REASONS.map(r=>`<option${r===a.reason?' selected':''}>${r}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Due date</label><input id="f-due" type="date" value="${a.due}" /></div>
          <div class="field"><label>Notes / next steps</label><textarea id="f-notes">${a.notes}</textarea></div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeMEl()">Cancel</button>
            <button class="btn-primary" onclick="saveEdit(${id})">Save changes</button>
          </div>
        </div>
      </div>`;
  }

  function saveEdit(id) {
    const idx = accounts.findIndex(x => x.id === id);
    const r   = document.getElementById('f-rep').value;
    accounts[idx] = {
      ...accounts[idx],
      account: document.getElementById('f-account').value.trim(),
      rep: r, repEmail: REP_EMAILS[r] || accounts[idx].repEmail,
      reason: document.getElementById('f-reason').value,
      due:    document.getElementById('f-due').value,
      notes:  document.getElementById('f-notes').value.trim()
    };
    closeMEl(); render();
  }

  function del(id) {
    if (!confirm('Remove this account from the stalled list?')) return;
    accounts = accounts.filter(x => x.id !== id);
    render();
  }

  function closeMBg(e) { if (e.target.classList.contains('modal-bg')) closeMEl(); }
  function closeMEl()  { document.getElementById('modal-root').innerHTML = ''; }

  // Init
  render();
</script>
</body>
</html>
